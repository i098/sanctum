[package]
name = "sanctum-listener-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sanctum-device-contract = { path = "../contract" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
signal-hook = "0.3"
time = { version = "0.3", features = ["serde-well-known"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4", "serde"] }
