# Changelog fragment check, split from ci.yml so label changes re-run only this workflow.
name: changelog

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  changelog:
    name: changelog fragment
    # A label event for any label but `no changelog` changes nothing here.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'no changelog') &&
      !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request HEAD is the merge commit; HEAD^1 is the base.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx towncrier==26.9.0 check --compare-with HEAD^1
