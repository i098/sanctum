name: Device client

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-client:
    name: Device client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mirror.gcr.io/library/mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sanctum-ci-test
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      SANCTUM_TEST_MYSQL_URL: mysql://root:sanctum-ci-test@127.0.0.1:3306
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - name: Check the Rust workspace
        working-directory: devices
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run check:app -- --device-client
