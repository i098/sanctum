name: Device client

on:
  pull_request:
    branches: [main, fm/sanctum-any-device]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-client:
    name: Device client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy && rustup default 1.97.1
      - name: Resolve slice dependencies before the CLI lockfile lands
        if: hashFiles('devices/Cargo.lock') == ''
        working-directory: devices
        run: cargo generate-lockfile
      - name: Check the Rust workspace
        working-directory: devices
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
