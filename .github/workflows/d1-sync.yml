# Daily TiDB -> D1 snapshot for the standby database (docs/d1-switchover.md). Inert until the four secrets exist.
name: d1-sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-sync
  cancel-in-progress: false

jobs:
  d1-sync:
    name: Sync TiDB to D1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      D1_SYNC_MYSQL_URL: ${{ secrets.D1_SYNC_MYSQL_URL }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the secrets
        id: gate
        run: |
          missing=""
          for name in D1_SYNC_MYSQL_URL D1_DATABASE_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::D1 sync skipped: repository secrets not set:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        name: Install
        run: npm ci --ignore-scripts
      - if: steps.gate.outputs.ready == 'true'
        name: Write the database id
        run: sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" deploy/d1/wrangler.jsonc
      - if: steps.gate.outputs.ready == 'true'
        name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sanctum --remote --config deploy/d1/wrangler.jsonc
      - if: steps.gate.outputs.ready == 'true'
        name: Write the snapshot from TiDB
        run: node scripts/d1-sync.ts snapshot --out "$RUNNER_TEMP/snapshot.sql"
      - if: steps.gate.outputs.ready == 'true'
        name: Load the snapshot into D1
        run: npx wrangler d1 execute sanctum --remote --config deploy/d1/wrangler.jsonc --yes --file "$RUNNER_TEMP/snapshot.sql"
      - if: steps.gate.outputs.ready == 'true'
        name: Verify row counts and checksums
        run: node scripts/d1-sync.ts verify
