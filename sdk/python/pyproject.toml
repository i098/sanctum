[project]
name = "sanctum-sdk"
version = "0.1.0"
description = "Thin HTTPX client for the Sanctum v1 API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctum"]
