# Local production-shaped stack: the API and worker from one image on one SQLite file, and Caddy for HTTPS.
#   docker compose run --rm api node server/dist/migrate.js   # explicit schema step
#   docker compose up -d api worker caddy
# SANCTUM_ENV defaults to production, which refuses to start until the open decisions in
# docs/DECISIONS.md are selected; use SANCTUM_ENV=development for a local fixture stack.
# Rollback: set SANCTUM_IMAGE to the previous validated tag and `up -d api worker`; data
# volumes and R2 objects are untouched and migrations are never reversed.
name: sanctum

x-app: &app
  image: ${SANCTUM_IMAGE:-sanctum:local}
  build:
    context: .
    dockerfile: server/Dockerfile
  environment: &app-env
    SANCTUM_ENV: ${SANCTUM_ENV:-production}
    # Passed through only when set: comma-separated decisions an operator has selected.
    SANCTUM_SELECTED_DECISIONS:
    SANCTUM_OIDC_ISSUER:
    SANCTUM_OIDC_CLIENT_ID:
    SANCTUM_OIDC_CLIENT_SECRET:
    SANCTUM_OIDC_REDIRECT_URI:
    SANCTUM_OIDC_SCOPES:
    SANCTUM_MCP_ISSUER:
    SANCTUM_MCP_JWKS_URL:
    SANCTUM_MCP_RESOURCE:
    SANCTUM_MCP_DEFAULT_SCOPES:
    SANCTUM_EMBEDDED_ISSUER:
    BETTER_AUTH_SECRET:
    SANCTUM_DB_URL: file:/data/sanctum.db
  volumes:
    - sanctum-data:/data

services:
  api:
    <<: *app
    environment:
      <<: *app-env
      SANCTUM_DEVICE_PROXY: caddy
    ports:
      - 127.0.0.1:${API_PORT:-7102}:7102
    restart: unless-stopped

  worker:
    <<: *app
    command: ['node', 'server/dist/worker.js']
    restart: unless-stopped

  caddy:
    image: mirror.gcr.io/library/caddy:2.11.4-alpine
    environment:
      SANCTUM_SITE_ADDRESS: # passed through when set; the Caddyfile defaults to localhost
    ports:
      - ${WEB_PORT:-3102}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sanctum-data:
  caddy-data:
  caddy-config:
