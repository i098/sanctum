<title id="title">Sanctum fullscreen listening reference</title><desc id="desc">Design illustration: near-black fullscreen stage with the pale irregular waveform ported from the earlier kiosk, the live transcript rail on the left, the agent-work rail on the right, a sparse header and quiet footer controls.</desc>
